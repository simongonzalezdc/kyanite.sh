version: "2"
linters:
  default: standard
  disable:
    - unused        # dead-code cleanup deferred (tracked) — re-enable to prune
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: (_test\.go|/test/)
        linters: [errcheck, staticcheck]
formatters:
  enable:
    - gofmt
    - gofumpt
