name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & Test (Coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Lint
        run: make lint

      - name: Run tests with coverage
        run: |
          mkdir -p build/reports
          go test ./... -race -covermode=atomic -coverprofile=build/reports/coverage.out
          go tool cover -func=build/reports/coverage.out > build/reports/coverage.txt

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: build/reports
          if-no-files-found: error


  build:
    name: Native Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs:
      - lint-test
    timeout-minutes: 20
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail

          # Start timing for performance monitoring
          start_time=$(date +%s)

          mkdir -p build/bin
          ext=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ext=".exe"
          fi

          echo "Building for ${{ runner.os }}..."

          # Build with performance monitoring
          go build -trimpath -ldflags="-s -w" -o "build/bin/noise${ext}" ./cmd/noise

          # Verify binary was created and get size
          if [[ ! -f "build/bin/noise${ext}" ]]; then
            echo "ERROR: Binary was not created at build/bin/noise${ext}"
            exit 1
          fi

          binary_size=$(stat -c%s "build/bin/noise${ext}" 2>/dev/null || stat -f%z "build/bin/noise${ext}" 2>/dev/null || echo "0")
          echo "Binary size: ${binary_size} bytes"

          # Calculate total build time
          end_time=$(date +%s)
          build_duration=$((end_time - start_time))

          echo "Build completed in ${build_duration} seconds"
          echo "build_time_seconds=${build_duration}" >> $GITHUB_ENV
          echo "binary_size_bytes=${binary_size}" >> $GITHUB_ENV
          echo "platform=${{ runner.os }}" >> $GITHUB_ENV

      - name: Upload build metrics
        shell: bash
        run: |
          set -euo pipefail

          # Create build metrics file
          cat > build_metrics.json << EOF
          {
            "platform": "${{ runner.os }}",
            "build_time_seconds": ${build_time_seconds:-0},
            "binary_size_bytes": ${binary_size_bytes:-0},
            "go_version": "$(go version | cut -d' ' -f3)",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "github_run_id": "${GITHUB_RUN_ID}",
            "github_run_number": "${GITHUB_RUN_NUMBER}"
          }
          EOF

          echo "Build metrics:"
          cat build_metrics.json

      - name: Upload build metrics artifact
        uses: actions/upload-artifact@v4
        with:
         name: build-metrics-${{ runner.os }}
         path: build_metrics.json
         if-no-files-found: error

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: noise-native-${{ matrix.os }}
          path: build/bin
          if-no-files-found: error

  cross-compile:
    name: Cross Compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs:
      - lint-test
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
            ext: ""
          - goos: linux
            goarch: arm64
            archive: tar.gz
            ext: ""
          - goos: linux
            goarch: arm
            archive: tar.gz
            ext: ""
          - goos: linux
            goarch: 386
            archive: tar.gz
            ext: ""
          - goos: darwin
            goarch: amd64
            archive: tar.gz
            ext: ""
          - goos: darwin
            goarch: arm64
            archive: tar.gz
            ext: ""
          - goos: windows
            goarch: amd64
            archive: zip
            ext: .exe
          - goos: windows
            goarch: arm64
            archive: zip
            ext: .exe
          - goos: windows
            goarch: 386
            archive: zip
            ext: .exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross compile binary
        shell: bash
        run: |
          set -euo pipefail

          # Start timing for performance monitoring
          start_time=$(date +%s)

          output="noise-${{ matrix.goos }}-${{ matrix.goarch }}"
          binary_name="noise${{ matrix.ext }}"
          build_dir="dist/${output}"
          mkdir -p "${build_dir}"

          echo "Building for ${{ matrix.goos }}/${{ matrix.goarch }}..."

          # Build with performance monitoring
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "${build_dir}/${binary_name}" \
            ./cmd/noise

          # Verify binary was created and get size
          if [[ ! -f "${build_dir}/${binary_name}" ]]; then
            echo "ERROR: Binary was not created at ${build_dir}/${binary_name}"
            exit 1
          fi

          binary_size=$(stat -c%s "${build_dir}/${binary_name}" 2>/dev/null || stat -f%z "${build_dir}/${binary_name}" 2>/dev/null || echo "0")
          echo "Binary size: ${binary_size} bytes"

          # Package with timing
          pushd dist >/dev/null
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            echo "Creating ZIP archive..."
            time zip -r "${output}.zip" "${output}"
          else
            echo "Creating TAR.GZ archive..."
            time tar -czf "${output}.tar.gz" "${output}"
          fi
          popd >/dev/null

          # Clean up build directory
          rm -rf "${build_dir}"

          # Calculate total build time
          end_time=$(date +%s)
          build_duration=$((end_time - start_time))

          echo "Build completed in ${build_duration} seconds"
          echo "build_time_seconds=${build_duration}" >> $GITHUB_ENV
          echo "binary_size_bytes=${binary_size}" >> $GITHUB_ENV
          echo "platform=${{ matrix.goos }}_${{ matrix.goarch }}" >> $GITHUB_ENV

      - name: Upload build metrics
        shell: bash
        run: |
          set -euo pipefail

          # Create build metrics file
          cat > build_metrics.json << EOF
          {
            "platform": "${{ matrix.goos }}_${{ matrix.goarch }}",
            "build_time_seconds": ${build_time_seconds:-0},
            "binary_size_bytes": ${binary_size_bytes:-0},
            "go_version": "$(go version | cut -d' ' -f3)",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "github_run_id": "${GITHUB_RUN_ID}",
            "github_run_number": "${GITHUB_RUN_NUMBER}"
          }
          EOF

          echo "Build metrics:"
          cat build_metrics.json

      - name: Upload build metrics artifact
        uses: actions/upload-artifact@v4
        with:
         name: build-metrics-${{ matrix.goos }}-${{ matrix.goarch }}
         path: build_metrics.json
         if-no-files-found: error

      - name: Upload cross-compiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: noise-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/noise-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error

  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - cross-compile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: noise-*
          merge-multiple: true
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}