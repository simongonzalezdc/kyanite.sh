name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & Test (Coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84
        with:
          version: v1.64.8

      - name: Lint
        run: make lint

      - name: Run tests with coverage
        run: |
          mkdir -p build/reports
          go test ./... -race -covermode=atomic -coverprofile=build/reports/coverage.out
          go tool cover -func=build/reports/coverage.out > build/reports/coverage.txt

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-coverage
          path: build/reports
          if-no-files-found: error


  build:
    name: Native Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs:
      - lint-test
    timeout-minutes: 20
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail

          # Start timing for performance monitoring
          start_time=$(date +%s)

          mkdir -p build/bin
          ext=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ext=".exe"
          fi

          echo "Building for ${{ runner.os }}..."

          # Build with performance monitoring
          go build -trimpath -ldflags="-s -w" -o "build/bin/noise${ext}" ./cmd/noise

          # Verify binary was created and get size
          if [[ ! -f "build/bin/noise${ext}" ]]; then
            echo "ERROR: Binary was not created at build/bin/noise${ext}"
            exit 1
          fi

          binary_size=$(stat -c%s "build/bin/noise${ext}" 2>/dev/null || stat -f%z "build/bin/noise${ext}" 2>/dev/null || echo "0")
          echo "Binary size: ${binary_size} bytes"

          # Calculate total build time
          end_time=$(date +%s)
          build_duration=$((end_time - start_time))
          echo "Build duration: ${build_duration} seconds"
