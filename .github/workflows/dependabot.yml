name: Dependency Update Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  go-module-update-report:
    name: Go Module Update Report
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Detect outdated modules
        id: detect
        run: |
          mkdir -p build/dependabot
          go list -m -u -json all | jq -r 'select(.Path != "std" and .Update != null) | "\(.Path) \(.Version) -> \(.Update.Version)"' > build/dependabot/outdated.txt
          go list -m -u -json all > build/dependabot/outdated.json
          if [ -s build/dependabot/outdated.txt ]; then
            echo "updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize update status
        run: |
          {
            echo "## Go Module Update Report"
            echo ""
            if [ -s build/dependabot/outdated.txt ]; then
              echo "| Module | Current | Latest |"
              echo "| ------ | ------- | ------ |"
              while read -r line; do
                module=$(echo "$line" | awk '{print $1}')
                current=$(echo "$line" | awk '{print $2}')
                latest=$(echo "$line" | awk '{print $4}')
                echo "| $module | $current | $latest |"
              done < build/dependabot/outdated.txt
            else
              echo "All Go module dependencies are up to date."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dependency reports
        uses: actions/upload-artifact@v4
        with:
          name: go-module-update-report
          path: build/dependabot
          if-no-files-found: warn

      - name: Create or update tracking issue
        if: steps.detect.outputs.updates == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'build/dependabot/outdated.txt';
            const report = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '(no data)';
            const { owner, repo } = context.repo;
            const labelName = 'dependency-update';
            const title = 'Dependency update report';
            const body = [
              'The scheduled dependency update check detected newer versions for one or more Go modules.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              '_Automated by .github/workflows/dependabot.yml_'
            ].join('\n');

            try {
              await github.rest.issues.createLabel({ owner, repo, name: labelName, color: '1d76db' });
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }
            }

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: labelName,
            });

            const issue = existing.find((item) => item.title === title);

            if (issue) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: [labelName],
              });
            }

      - name: Close tracking issue if no updates remain
        if: steps.detect.outputs.updates == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const labelName = 'dependency-update';
            const title = 'Dependency update report';

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: labelName,
            });

            const issue = existing.find((item) => item.title === title);

            if (issue) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }