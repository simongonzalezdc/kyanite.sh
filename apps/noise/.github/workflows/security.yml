name: Security Scans

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  dependency-vulnerability:
    name: Dependency Vulnerability Scan
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install tooling
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Verify dependency signatures
        run: |
          go mod download
          go mod verify
      - name: Run govulncheck
        run: |
          mkdir -p build/security/govulncheck
          $(go env GOPATH)/bin/govulncheck -json ./... > build/security/govulncheck/report.json || true
          $(go env GOPATH)/bin/govulncheck ./... > build/security/govulncheck/report.txt || true
      - name: Upload vulnerability reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: govulncheck-report
          path: build/security/govulncheck
          if-no-files-found: error

  gosec:
    name: Static Application Security Testing
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec
        run: |
          mkdir -p build/security/gosec
          $(go env GOPATH)/bin/gosec -fmt=json -out build/security/gosec/report.json ./... || true
          $(go env GOPATH)/bin/gosec -fmt=txt ./... > build/security/gosec/report.txt || true
          $(go env GOPATH)/bin/gosec -fmt=sarif -out build/security/gosec/report.sarif ./... || true
      - name: Upload gosec reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gosec-report
          path: build/security/gosec
          if-no-files-found: error
      - name: Publish SARIF to code scanning
        uses: github/codeql-action/upload-sarif@03e4368ac7daa2bd82b3e85262f3bf87ee112f57
        with:
          sarif_file: build/security/gosec/report.sarif

  license-compliance:
    name: License Compliance
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest
      - name: Generate license reports
        run: |
          mkdir -p build/licenses
          $(go env GOPATH)/bin/go-licenses report ./... > build/licenses/licenses.txt
      - name: Enforce license policy
        run: |
          $(go env GOPATH)/bin/go-licenses check ./...
      - name: Upload license artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: license-reports
          path: build/licenses
          if-no-files-found: error